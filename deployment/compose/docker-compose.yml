include:
  - postgres-compose.yml
  - redis-compose.yml
  - kafka-compose.yml

services:
  esr-server:
    image: ezraorina834/rtss-server:${APP_VERSION}
    restart: unless-stopped
    environment:
      - DB_DOMAIN=${DB_DOMAIN}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_INTERNAL_PORT}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - KAFKA_HOST=${KAFKA_HOST}
      - KAFKA_PORT=${KAFKA_INTERNAL_PORT}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - REDIS_HOST=${REDIS_HOST}
      - PORT=${PORT}
      - CORS_PATTERNS=${CORS_PATTERNS}
      - REDIS_PORT=${REDIS_INTERNAL_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SHOW_SQL=${SHOW_SQL}
      - ESR_JWT_SECRET=${ESR_JWT_SECRET}
      - ESR_JWT_EXPIRATION_MINUTES=${ESR_JWT_EXPIRATION_MINUTES}
      - ESR_JWT_MAX_SESSION_MINUTES=${ESR_JWT_MAX_SESSION_MINUTES:-480}
      - ESR_PENDING_IDENTITY_LINK_EXPIRATION_MINUTES=${ESR_PENDING_IDENTITY_LINK_EXPIRATION_MINUTES}
      - ESR_CLIENT_SIDE_FILTER_THRESHOLD=${ESR_CLIENT_SIDE_FILTER_THRESHOLD:-1000}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - HIBERNATE_SQL_LOGGING=${HIBERNATE_SQL_LOGGING}
      - HIBERNATE_ENVERS_LOGGING=${HIBERNATE_ENVERS_LOGGING}
      - HIBERNATE_TYPE_LOGGING=${HIBERNATE_TYPE_LOGGING}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.esr-server-${ENV}.rule=Host(`rtss-server-${ENV}.ezra-home.me`)"
      - "traefik.http.routers.esr-server-${ENV}.entrypoints=websecure"
      - "traefik.http.routers.esr-server-${ENV}.tls=true"
      - "traefik.http.routers.esr-server-${ENV}.tls.certresolver=acme-cert-resolver"
      - "traefik.http.services.esr-server-${ENV}.loadbalancer.server.port=${PORT}"

    networks:
      - ezra-home
      - default

    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/${PORT}"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 90s

    depends_on:
      esr-postgres:
        condition: service_healthy
      esr-redis:
        condition: service_healthy
      esr-kafka:
        condition: service_healthy
